packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  '@mdi/font': ^7.4.47
  '@tanstack/vue-query': ^5.103.1
  '@types/node': ^24
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
  vite-plugin-pwa: ^1.3.0
  workbox-window: ^7.4.1
  '@hono/zod-validator': ^0.9.1
  zod: ^4.6.5
  jose: ^6.2.12
  libpg-query: 18.1.5
  sql.js: 1.14.1
  '@electric-sql/pglite': 0.5.8
  pg: 8.23.1
  '@types/pg': ^8.23.1
  '@tanstack/query-persist-client-core': ^5.104.1
  idb-keyval: ^6.3.0
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
allowBuilds:
  esbuild: true
  vue-demi: true
  workerd: true
minimumReleaseAgeExclude:
  - tsx@4.23.14
  - '@voidzero-dev/vite-plus-core@1.1.0'
  - '@voidzero-dev/vite-plus-darwin-arm64@1.1.0'
  - '@voidzero-dev/vite-plus-darwin-x64@1.1.0'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.1.0'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@1.1.0'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@1.1.0'
  - '@voidzero-dev/vite-plus-linux-x64-musl@1.1.0'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.1.0'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@1.1.0'
  - vite-plus@1.1.0
